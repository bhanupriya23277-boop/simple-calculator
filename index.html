
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8eef5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #b0bec5;
            width: 300px;
            text-align: center;
        }

        h2 {
            color: #243b55;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            font-size: 18px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .clear {
            background: #dc2626;
            grid-column: span 2;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Simple Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">

        <div class="buttons">
            <button onclick="calculate('+')">+</button>
            <button onclick="calculate('-')">−</button>
            <button onclick="calculate('*')">×</button>
            <button onclick="calculate('/')">÷</button>
            <button class="clear" onclick="clearCalculator()">Clear</button>
        </div>

        <p id="result">Result: 0</p>
    </div>

    <script>
        function calculate(operator) {
            const a = document.getElementById("num1").value;
            const b = document.getElementById("num2").value;
            const result = document.getElementById("result");

            if (a.trim() === "" || b.trim() === "") {
                result.textContent = "Please enter both numbers!";
                return;
            }

            const num1 = Number(a);
            const num2 = Number(b);
            let answer;

            switch (operator) {
                case '+':
                    answer = num1 + num2;
                    break;

                case '-':
                    answer = num1 - num2;
                    break;

                case '*':
                    answer = num1 * num2;
                    break;

                case '/':
                    if (num2 === 0) {
                        result.textContent = "Cannot divide by zero!";
                        return;
                    }
                    answer = num1 / num2;
                    break;
            }

            result.textContent = "Result: " + answer;
        }

        function clearCalculator() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("result").textContent = "Result: 0";
        }
    </script>

</body>
</html>
